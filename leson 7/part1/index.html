<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form> 
          <fieldset>
              <legend>Personal information:</legend>
              <label for="firstname">First Name:</label>
              <input type="text" id="firstname" name="firstname" value="Dijar" readonly>
              <label for="lastname">Last Name:</label>
               <input type="text" id="lastname" name="lastname" value="perquku" disabled> 
               <label for="email">Email:</label><br>
               <input type="text" id="email" name="email" required>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" size="40" placeholder="password">
                <label>gender</label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label><br>
                <label>hobbies:</label><br>
                <input type="checkbox" id="gaming" name="gaming" value="gaming">
                <label for="gaming">Gaming</label><br>
                <input type="checkbox" id="football" name="football" value="football">
                <label for="football">Football</label><br>
                <label for="pets">Choose a pet</label>
                <select name="pet" id="pet">
                 <option value="Dog">Dog</option>
                 <option value="Cat">Cat</option>
                 <option value="Parrot">Parrot</option>
                </select><br><br>
          </fieldset>
    </form>
</body>
</html>
